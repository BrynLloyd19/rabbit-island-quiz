function getRecommendation(answers) {
  const { milk, flavour, strength, brew, adventure, decaf } = answers;

  // Decaf — anyone who ticks either decaf option
  if (decaf === "no" || decaf === "sometimes") {
    if (brew === "pod") return "decaf_pod";
    return "decaf";
  }

  // Pod machine users only get pod products
  if (brew === "pod") return "seasonal_pod";

  // Score each coffee based on how well the answers match
  const scores = {
    seasonal:      0,
    black_rabbit:  0,
    konga:         0,
    timor_washed:  0,
    timor_natural: 0,
    colombian:     0,
  };

  // Brew method compatibility per coffee:
  // seasonal:     espresso, filter, plunger, aeropress, stovetop
  // black_rabbit: espresso, plunger, stovetop
  // konga:        filter, plunger, aeropress, stovetop
  // timor_washed: espresso, filter, plunger, aeropress, stovetop
  // timor_natural:filter, plunger, aeropress
  // colombian:    espresso, filter, aeropress, stovetop
  // decaf:        espresso, filter, plunger, aeropress, stovetop

  // Seasonal: espresso, filter, plunger, aeropress, stovetop — suits all except pod
  // Roast: Medium → scores for medium strength
  if (milk === "black" || milk === "both") scores.seasonal += 2;
  if (milk === "milk")                     scores.seasonal += 1;
  if (flavour === "chocolate")             scores.seasonal += 2;
  if (flavour === "fruity")                scores.seasonal += 1;
  if (flavour === "balanced")              scores.seasonal += 1;
  if (strength === "medium")               scores.seasonal += 2;
  if (strength === "light")                scores.seasonal -= 1;
  if (brew === "espresso")                 scores.seasonal += 2;
  if (brew === "filter")                   scores.seasonal += 2;
  if (brew === "plunger")                  scores.seasonal += 2;

  // Black Rabbit: espresso, plunger, stovetop — NOT filter, NOT pod
  // Roast: Medium-Dark → scores for full/medium strength
  if (milk === "milk")         scores.black_rabbit += 3;
  if (strength === "full")     scores.black_rabbit += 4;
  if (strength === "medium")   scores.black_rabbit += 1;
  if (flavour === "chocolate") scores.black_rabbit += 3;
  if (milk === "black")        scores.black_rabbit += 1;
  if (strength === "light")    scores.black_rabbit -= 2;
  if (brew === "espresso")     scores.black_rabbit += 3;
  if (brew === "plunger")      scores.black_rabbit += 2;
  if (brew === "filter")       scores.black_rabbit -= 3;

  // Konga: filter, plunger, aeropress, stovetop — NOT espresso, NOT pod
  // Roast: Light → scores for light strength
  if (flavour === "fruity")        scores.konga += 3;
  if (adventure === "curious")     scores.konga += 2;
  if (adventure === "wild")        scores.konga += 1;
  if (strength === "light")        scores.konga += 3;
  if (strength === "medium")       scores.konga += 1;
  if (strength === "full")         scores.konga -= 1;
  if (brew === "filter")           scores.konga += 3;
  if (brew === "plunger")          scores.konga += 2;
  if (brew === "espresso")         scores.konga -= 2;

  // Timor Railaco: espresso, filter, plunger, aeropress, stovetop — NOT pod
  // Roast: Medium → scores for medium strength
  if (flavour === "earthy")        scores.timor_washed += 3;
  if (flavour === "balanced")      scores.timor_washed += 2;
  if (adventure === "curious")     scores.timor_washed += 2;
  if (strength === "medium")       scores.timor_washed += 2;
  if (strength === "light")        scores.timor_washed += 1;
  if (strength === "full")         scores.timor_washed -= 1;
  if (brew === "espresso")         scores.timor_washed += 2;
  if (brew === "filter")           scores.timor_washed += 2;
  if (brew === "plunger")          scores.timor_washed += 2;

  // Timor Natural: filter, plunger, aeropress — NOT espresso, NOT stovetop, NOT pod
  // Roast: Light-Medium → scores for light/medium strength
  if (adventure === "wild")                            scores.timor_natural += 4;
  if (flavour === "fruity" && adventure === "wild")    scores.timor_natural += 3;
  if (flavour === "fruity" && adventure === "curious") scores.timor_natural += 1;
  if (strength === "light")                            scores.timor_natural += 2;
  if (strength === "medium")                           scores.timor_natural += 1;
  if (strength === "full")                             scores.timor_natural -= 1;
  if (brew === "filter")                               scores.timor_natural += 3;
  if (brew === "plunger")                              scores.timor_natural += 2;
  if (brew === "espresso")                             scores.timor_natural -= 3;

  // San Sebastián: espresso, filter, aeropress, stovetop — NOT plunger, NOT pod
  // Roast: Light → scores for light strength
  if (flavour === "fruity")        scores.colombian += 2;
  if (adventure === "curious")     scores.colombian += 2;
  if (flavour === "balanced")      scores.colombian += 1;
  if (strength === "light")        scores.colombian += 3;
  if (strength === "medium")       scores.colombian += 1;
  if (strength === "full")         scores.colombian -= 2;
  if (brew === "espresso")         scores.colombian += 2;
  if (brew === "filter")           scores.colombian += 3;
  if (brew === "plunger")          scores.colombian -= 2;

  // Priority order for tie-breaking (lower = higher priority)
  const priority = {
    seasonal:      1,
    black_rabbit:  2,
    konga:         3,
    timor_washed:  4,
    timor_natural: 5,
    colombian:     6,
  };

  // Find the highest score, breaking ties with priority
  const winner = Object.keys(scores).sort((a, b) => {
    if (scores[b] !== scores[a]) return scores[b] - scores[a];
    return priority[a] - priority[b];
  })[0];

  return winner;
}

  .intro-desc {
    font-size: 15px;
    color: ${BRAND.mid};
    line-height: 1.7;
    margin-bottom: 32px;
    font-weight: 400;
  }

  .start-btn {
    display: inline-block;
    padding: 18px 40px;
    background: ${BRAND.forest};
    color: white;
    border: none;
    border-radius: 14px;
    font-family: 'Quicksand', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .start-btn:hover {
    background: ${BRAND.forestLight};
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(37,70,54,0.35);
  }

  @media (max-width: 480px) {
    .card, .result-card, .intro-card { border-radius: 16px; }
    .card { padding: 28px 24px; }
    .result-hero { padding: 36px 24px 28px; }
    .result-body { padding: 24px; }
    .intro-card { padding: 36px 24px; }
    .question-text { font-size: 22px; }
    .result-name { font-size: 28px; }
  }

  /* Fun fact */
  .fun-fact {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 16px;
    background: ${BRAND.forestPale};
    border-left: 3px solid ${BRAND.forest};
    border-radius: 0 12px 12px 0;
    margin-bottom: 20px;
  }

  .fun-fact-icon {
    font-size: 20px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .fun-fact-text {
    font-size: 13px;
    font-weight: 500;
    color: ${BRAND.dark};
    line-height: 1.6;
  }

  /* Drip bag callout */
  .drip-bag-callout {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: ${BRAND.purplePale};
    border: 1px solid ${BRAND.purple}33;
    border-radius: 12px;
    margin-bottom: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .drip-bag-callout:hover {
    background: ${BRAND.purplePale};
    border-color: ${BRAND.purple};
    transform: translateX(2px);
  }

  .drip-bag-icon {
    font-size: 20px;
    flex-shrink: 0;
  }

  .drip-bag-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }

  .drip-bag-title {
    font-size: 13px;
    font-weight: 700;
    color: ${BRAND.purpleDark};
    display: block;
  }

  .drip-bag-sub {
    font-size: 12px;
    font-weight: 500;
    color: ${BRAND.mid};
    display: block;
  }

  .drip-bag-arrow {
    font-size: 16px;
    color: ${BRAND.purpleDark};
    flex-shrink: 0;
  }

  /* Product details */
  .product-details {
    border: 1px solid ${BRAND.border};
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid ${BRAND.border};
  }

  .detail-row:last-child {
    border-bottom: none;
  }

  .detail-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: ${BRAND.mid};
    flex-shrink: 0;
  }

  .detail-value {
    font-size: 13px;
    font-weight: 500;
    color: ${BRAND.dark};
    text-align: right;
  }

  .detail-price {
    font-weight: 700;
    color: ${BRAND.forest};
    font-size: 15px;
  }

  /* Loading */
  .product-loading {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    background: ${BRAND.forestPale};
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 13px;
    font-weight: 600;
    color: ${BRAND.forest};
  }

  .loading-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid ${BRAND.sageLight};
    border-top-color: ${BRAND.forest};
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
`;

function App() {
  const [screen, setScreen] = useState("intro");
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [selected, setSelected] = useState(null);

  const handleAnswer = (value) => {
    setSelected(value);
    setTimeout(() => {
      const key = questions[step].id;
      const newAnswers = { ...answers, [key]: value };
      setAnswers(newAnswers);
      setSelected(null);
      if (step + 1 < questions.length) {
        setStep(step + 1);
      } else {
        setScreen("result");
      }
    }, 300);
  };

  const reset = () => {
    setScreen("intro");
    setStep(0);
    setAnswers({});
    setSelected(null);
  };

  const recommendationKey = screen === "result" ? getRecommendation(answers) : null;
  const recommendation = recommendationKey ? coffees[recommendationKey] : null;

  return (
    <>
      <style>{styles}</style>
      <div className="app">
        <div className="header">
          <img src={LOGO_SRC} alt="Rabbit Island Coffee Co." style={{ width: 180, display: 'block', margin: '0 auto' }} />
        </div>

        {screen === "intro" && (
          <div className="intro-card">
            <div style={{ fontSize: 56, marginBottom: 16 }}>☕</div>
            <div className="intro-title">Find Your Perfect Coffee</div>
            <div className="intro-desc">
              Six quick questions. One perfect match.<br />
              We'll find the coffee that fits you best from our range of specialty roasts.
            </div>
            <button className="start-btn" onClick={() => setScreen("quiz")}>
              Let's go →
            </button>
          </div>
        )}

        {screen === "quiz" && (
          <>
            <div style={{ width: "100%", maxWidth: 540 }}>
              <div className="progress-track">
                <div
                  className="progress-fill"
                  style={{ width: `${((step + 1) / questions.length) * 100}%` }}
                />
              </div>
              <div className="progress-label">
                {step + 1} of {questions.length}
              </div>
            </div>

            <div className="card" key={step}>
              <div className="question-num">Question {step + 1}</div>
              <div className="question-text">{questions[step].text}</div>
              <div className="question-sub">{questions[step].sub}</div>
              <div className="options">
                {questions[step].options.map((opt) => (
                  <button
                    key={opt.value}
                    className={`option-btn${selected === opt.value ? " selected" : ""}`}
                    onClick={() => handleAnswer(opt.value)}
                  >
                    <span className="option-icon">{opt.icon}</span>
                    <span className="option-label">{opt.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </>
        )}

        {screen === "result" && recommendation && (
          <div className="result-card">
            <div className="result-hero" style={{ background: recommendation.gradient }}>
              <div className="result-emoji">{recommendation.animalEmoji}</div>
              <div className="result-eyebrow">Your perfect match</div>
              <div className="result-name">{recommendation.name}</div>
              <div className="result-tagline">{recommendation.tagline}</div>
            </div>
            <div className="result-body">

              <div className="result-desc">{recommendation.description}</div>

              <div className="result-chips">
                {recommendation.flavours.split(" · ").map((f) => (
                  <span className="chip" key={f}>{f}</span>
                ))}
              </div>

              {recommendation.details && recommendation.details.length > 0 && (
                <div className="product-details">
                  {recommendation.details.map((row) => (
                    <div className="detail-row" key={row.label}>
                      <span className="detail-label">{row.label}</span>
                      <span className="detail-value">{row.value}</span>
                    </div>
                  ))}
                </div>
              )}

              {recommendation.funFact && (
                <div className="fun-fact">
                  <span className="fun-fact-icon">{recommendation.animalEmoji}</span>
                  <span className="fun-fact-text">{recommendation.funFact}</span>
                </div>
              )}

              {recommendation.dripBagUrl && (
                <div className="drip-bag-callout" onClick={() => window.open(recommendation.dripBagUrl, "_blank")}>
                  <span className="drip-bag-icon">✈️</span>
                  <div className="drip-bag-text">
                    <span className="drip-bag-title">Also available as drip bags.</span>
                    <span className="drip-bag-sub">Brew anywhere, no equipment needed</span>
                  </div>
                  <span className="drip-bag-arrow">→</span>
                </div>
              )}

              <div className="result-brew">
                <span className="brew-icon">☕</span>
                <span className="brew-text">{recommendation.brew}</span>
              </div>

              <button className="cta-btn" onClick={() => window.open(recommendation.url, "_blank")}>
                Shop Now →
              </button>
              <button className="retake-btn" onClick={reset}>
                ↩ Start over
              </button>
            </div>
          </div>
        )}

        <div className="divider" style={{ marginTop: 40 }} />
      </div>
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
